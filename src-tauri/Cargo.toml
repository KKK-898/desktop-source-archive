[package]
name = "gaoge-free"
version = "1.7.1"
description = "Gaoge Free desktop client"
authors = ["GaogeAI"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1"
fs2 = "0.4"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml_edit = "=0.20.2"
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "gzip"] }
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md5 = "0.7"
memchr = "2.7"
once_cell = "1"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
minisign-verify = "=0.2.5"
flate2 = "1"
tar = "0.4"
semver = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tempfile = "3"
walkdir = "2"
zip = "4.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
security-framework = "3.7.0"

[dev-dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

