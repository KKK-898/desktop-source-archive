<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gaoge 图片预览</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #ffffff;
        color: #202123;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #202123;
          color: #f7f7f8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 240px;
        background: transparent;
      }

      main {
        padding: 12px;
      }

      .summary {
        margin: 0 0 10px;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.45;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .card {
        overflow: hidden;
        border: 1px solid rgba(127, 127, 127, 0.28);
        border-radius: 12px;
        background: rgba(127, 127, 127, 0.08);
      }

      .preview {
        display: flex;
        min-height: 220px;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(45deg, rgba(127, 127, 127, 0.08) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(127, 127, 127, 0.08) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(127, 127, 127, 0.08) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(127, 127, 127, 0.08) 75%);
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }

      .preview img {
        display: block;
        width: 100%;
        max-height: 520px;
        object-fit: contain;
      }

      .loading,
      .error {
        padding: 24px 14px;
        color: #6b7280;
        font-size: 13px;
        text-align: center;
      }

      .error {
        color: #b42318;
      }

      .caption {
        overflow: hidden;
        padding: 8px 10px;
        color: inherit;
        font-size: 12px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="summary" class="summary">正在等待图片结果……</p>
      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>
    <script>
      (() => {
        const pendingRequests = new Map();
        const objectUrls = [];
        let nextRequestId = 1;

        const summary = document.getElementById("summary");
        const gallery = document.getElementById("gallery");

        function request(method, params) {
          const id = nextRequestId++;
          window.parent.postMessage(
            { jsonrpc: "2.0", id, method, params },
            "*",
          );
          return new Promise((resolve, reject) => {
            pendingRequests.set(id, { resolve, reject });
          });
        }

        function notify(method, params) {
          window.parent.postMessage(
            { jsonrpc: "2.0", method, params },
            "*",
          );
        }

        function releaseObjectUrls() {
          while (objectUrls.length > 0) {
            URL.revokeObjectURL(objectUrls.pop());
          }
        }

        function setTheme(theme) {
          if (theme === "dark" || theme === "light") {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
          }
        }

        function decodeBlob(blob, mimeType, expectedBytes) {
          const normalizedBlob = blob.replace(/\s+/g, "");
          const binary = atob(normalizedBlob);
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) {
            bytes[index] = binary.charCodeAt(index);
          }
          const expected = Number(expectedBytes);
          if (Number.isFinite(expected) && expected > 0 && bytes.length !== expected) {
            throw new Error(
              `图片资源不完整（收到 ${bytes.length} 字节，应为 ${expected} 字节）`,
            );
          }
          const resolvedMimeType = mimeType || "image/png";
          let objectUrl = "";
          try {
            objectUrl = URL.createObjectURL(
              new Blob([bytes], { type: resolvedMimeType }),
            );
          } catch {
            // 某些 MCP 宿主会限制 blob: 图片，稍后使用 data: URL 兜底。
          }
          return {
            objectUrl,
            dataUrl: `data:${resolvedMimeType};base64,${normalizedBlob}`,
            byteLength: bytes.length,
          };
        }

        async function readImageResource(resourceUri, mimeType, expectedBytes) {
          const response = await request("resources/read", { uri: resourceUri });
          const resource = response?.contents?.[0];
          if (!resource) {
            throw new Error("图片资源为空");
          }
          if (typeof resource.blob !== "string") {
            throw new Error("图片资源格式无效");
          }
          return decodeBlob(
            resource.blob,
            resource.mimeType || mimeType,
            expectedBytes,
          );
        }

        function showPreviewError(preview, message) {
          const error = document.createElement("div");
          error.className = "error";
          error.textContent = message;
          preview.replaceChildren(error);
        }

        function renderImage(preview, resource, alt, fileName) {
          const imageElement = document.createElement("img");
          imageElement.alt = alt;
          preview.replaceChildren(imageElement);

          const trySource = (source, fallback) => {
            imageElement.onload = () => {
              if (fallback) {
                imageElement.title = "已使用兼容预览方式";
              }
            };
            imageElement.onerror = () => {
              if (!fallback && resource.dataUrl) {
                trySource(resource.dataUrl, true);
                return;
              }
              showPreviewError(
                preview,
                `图片预览失败：${fileName || "生成图片"}（资源已读取，但当前宿主无法解码）`,
              );
            };
            imageElement.src = source;
          };

          if (resource.objectUrl) {
            objectUrls.push(resource.objectUrl);
          }
          trySource(resource.objectUrl || resource.dataUrl, !resource.objectUrl);
        }

        function imageEntries(result) {
          const structured = result?.structuredContent || {};
          const privateResult = result?._meta?.["gaoge/imagePreview"];
          if (Array.isArray(privateResult?.images)) {
            return privateResult.images;
          }
          return Array.isArray(structured.images) ? structured.images : [];
        }

        function renderResult(result) {
          releaseObjectUrls();
          gallery.replaceChildren();

          const images = imageEntries(result);
          const count = Number(result?.structuredContent?.count ?? images.length);
          if (images.length === 0) {
            summary.textContent = result?.isError
              ? "图片生成失败。"
              : "没有可显示的图片。";
            return;
          }

          const allAnimated = images.every((image) =>
            image.mimeType === "image/gif" || /\.gif$/i.test(image.fileName || ""),
          );
          summary.textContent = allAnimated
            ? `已生成 ${count || images.length} 个 GIF 动图`
            : `已生成 ${count || images.length} 张图片`;
          for (const [index, image] of images.entries()) {
            const card = document.createElement("article");
            card.className = "card";

            const preview = document.createElement("div");
            preview.className = "preview";
            const loading = document.createElement("div");
            loading.className = "loading";
            loading.textContent = "正在加载……";
            preview.appendChild(loading);

            const caption = document.createElement("div");
            caption.className = "caption";
            caption.textContent =
              image.fileName || `生成图片 ${index + 1}`;

            card.append(preview, caption);
            gallery.appendChild(card);

            if (!image.resourceUri) {
              loading.className = "error";
              loading.textContent = image.previewUnavailableReason ||
                "文件已保存，当前无法内嵌预览，请从保存位置打开。";
              continue;
            }

            readImageResource(image.resourceUri, image.mimeType, image.bytes)
              .then((resource) => {
                renderImage(
                  preview,
                  resource,
                  image.fileName || `生成图片 ${index + 1}`,
                  image.fileName,
                );
              })
              .catch((error) => {
                loading.className = "error";
                loading.textContent =
                  error?.message || "图片加载失败";
              });
          }

          requestAnimationFrame(() => {
            notify("ui/notifications/size-changed", {
              height: Math.min(document.documentElement.scrollHeight, 760),
            });
          });
        }

        window.addEventListener(
          "message",
          (event) => {
            if (event.source !== window.parent) {
              return;
            }
            const message = event.data;
            if (!message || message.jsonrpc !== "2.0") {
              return;
            }

            if (message.id !== undefined && pendingRequests.has(message.id)) {
              const pending = pendingRequests.get(message.id);
              pendingRequests.delete(message.id);
              if (message.error) {
                pending.reject(
                  new Error(message.error.message || "MCP 请求失败"),
                );
              } else {
                pending.resolve(message.result);
              }
              return;
            }

            if (message.method === "ui/notifications/tool-result") {
              renderResult(message.params || {});
            } else if (
              message.method === "ui/notifications/host-context-changed"
            ) {
              setTheme(message.params?.theme);
            }
          },
          { passive: true },
        );

        const initialToolOutput = window.openai?.toolOutput;
        if (initialToolOutput) {
          renderResult(initialToolOutput);
        }

        request("ui/initialize", {
          protocolVersion: "2025-06-18",
          appInfo: {
            name: "gaoge-image-preview",
            version: "1",
          },
          appCapabilities: {},
        })
          .then((result) => {
            setTheme(result?.hostContext?.theme);
            notify("ui/notifications/initialized", {});
          })
          .catch(() => {
            // Older hosts may expose only the compatibility window.openai API.
          });
      })();
    </script>
  </body>
</html>
