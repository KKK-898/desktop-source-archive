name: Platform Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Preserve exact Git blob bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: mobile-bridge/requirements-relay.txt

      - name: Install mobile relay test dependencies
        run: python -m pip install -r mobile-bridge/requirements-relay.txt

      - name: Test isolated mobile relay and controller
        working-directory: mobile-bridge
        run: |
          python -m unittest discover -s tests -p test_phone_relay.py
          python -m unittest discover -s tests -p test_mobile_controller.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run build
      - run: npm run test:codex-account-route
      - run: npm run test:conversation-recovery
      - name: Install Chromium for plugin marketplace UI tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:codex-plugin-market-ui
      - run: npm run test:codex-plugin-toggle
      - run: npm run test:codex-paste
      - run: npm run test:codex-patch
      - run: npm run test:codex-native-fast
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_fast_ -- --test-threads=1
      - run: npm run test:codex-ultra
      - run: npm run test:release-tooling
      - run: npm run test:release-remote
      - run: npm run verify:platform
      - run: npm run verify:workflows
      - run: npm run verify:release
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  macos-secure-storage:
    runs-on: macos-latest
    steps:
      - name: Preserve exact Git blob bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Prepare isolated test keychain
        run: |
          task_keychain="$RUNNER_TEMP/gaoge-storage-test.keychain-db"
          printf 'GAOGE_TEST_KEYCHAIN_PATH=%s\n' "$task_keychain" >> "$GITHUB_ENV"
          security create-keychain -p gaoge-ci-test "$task_keychain"
          security set-keychain-settings -lut 21600 "$task_keychain"
          security unlock-keychain -p gaoge-ci-test "$task_keychain"
          security default-keychain -d user -s "$task_keychain"
          security list-keychains -d user -s "$task_keychain"

      - name: Verify native macOS credential encryption
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib macos_secure_storage

      - name: Verify Ultra query adaptation and restart preparation on macOS
        run: |
          npm run test:codex-native-fast
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_fast_ -- --test-threads=1
          npm run test:codex-ultra
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib ultra -- --test-threads=1

      - name: Verify pre-login authentication survives no-account login
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib relay_close_preserves_unrelated_personal_api_auth

      - name: Verify old authentication backups migrate automatically
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib relay_login_migrates_legacy_auth_backup

      - name: Verify retained authentication is backed up before replacement
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib relay_login_encrypts_in_place_auth_before_replacement
