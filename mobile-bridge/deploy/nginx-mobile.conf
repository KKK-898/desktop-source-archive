# Include inside the existing api.gaogeaii.com HTTPS server block.
# Keep /mobile in the upstream URI; the relay supports an explicit base prefix.
location = /mobile { return 302 /mobile/; }
location ^~ /mobile/ {
    proxy_pass http://127.0.0.1:18790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $niubi999_connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    client_max_body_size 21m;
    access_log off;
}
