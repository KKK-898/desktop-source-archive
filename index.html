<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaoge Free</title>
    <style>
      html,
      body,
      #app {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #0f131a;
      }

      body {
        overflow: hidden;
      }

      .app-boot-shell {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.08), transparent 30%),
          #151515;
      }

      .app-boot-logo {
        display: grid;
        width: 315px;
        height: 420px;
        place-items: center;
        border-radius: 24px;
        background: #272727;
        box-shadow:
          0 4px 8px rgba(0, 0, 0, 0.2),
          0 8px 16px rgba(0, 0, 0, 0.2),
          inset 0 40px 60px -8px rgba(255, 255, 255, 0.12);
      }

      .app-boot-logo img {
        width: 65px;
        height: 65px;
        display: block;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-shell">
        <div class="app-boot-logo">
          <img src="/favicon.png" alt="" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
